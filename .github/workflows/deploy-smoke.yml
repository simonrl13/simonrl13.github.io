name: deploy-smoke

# Every successful production deploy (Vercel reports it to GitHub): one
# question to the live chat that only checks it returns a real answer — not a
# 5xx, not the safe fallback (scripts/chat-smoke.mjs). No key, no judge.

on: deployment_status

permissions:
  contents: read

jobs:
  chat:
    name: chat-smoke
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/chat-smoke.mjs https://www.simonlaborde.com
