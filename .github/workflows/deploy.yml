name: Deploy GitHub Pages redirect

# simonrl13.github.io is retired as a mirror. GitHub Pages can't send a
# server-side 301, so it serves pages-redirect/: a page that sends visitors
# (and any path they asked for, e.g. /assets/cv.pdf) to www.simonlaborde.com.
# 404.html is the same page, so every old URL redirects too.

on:
  push:
    branches: [main]
    paths:
      - pages-redirect/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the redirect site
        run: |
          mkdir -p site
          cp pages-redirect/index.html site/index.html
          cp pages-redirect/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
