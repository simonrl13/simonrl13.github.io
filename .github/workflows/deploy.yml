name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate OG image / icons from their SVG sources.
      - run: node scripts/gen-assets.mjs

      # GitHub Pages is static-only and can't run the /api/chat route (that
      # only exists on Vercel) — strip it before the export build so Next
      # never tries to statically render a dynamic POST handler.
      - run: rm -rf app/api

      - run: npm run build:static

      # GitHub Pages' modern Actions deploy does not run Jekyll, but keep the
      # guard so the _next/ directory is never stripped.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
