version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # one weekly PR for every npm update (major, minor, patch), so each batch
    # triggers one probe run (package.json / package-lock.json are probe paths).
    # Security updates come as soon as an advisory lands, also as one group.
    groups:
      npm-weekly:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Major upgrades need a planned migration (they fail `verify` as-is).
      # Remove an entry when that migration is scheduled.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
